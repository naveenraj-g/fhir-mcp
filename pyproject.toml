[project]
name = "fhir-mcp"
version = "0.1.0"
description = "Config-driven MCP server exposing FHIR backends (internal fhir-server REST/GraphQL, Medplum) as MCP tools"
readme = "README.md"
authors = [
    { name = "Naveen Raj", email = "naveenraj.gnr2002@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.1.8,<5",
    "graphql-mcp>=3.2.1",
    "httpx2>=2.16.0",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.3",
]

# Application, not a library — same layout as fhir-gql (code under app/, run
# with `uv run python -m app`), so nothing to build or install.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
